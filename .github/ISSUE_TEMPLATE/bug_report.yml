name: Bug Report
description: Report a bug or unexpected behavior in jGuard
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Create a policy file with...
        2. Run with agent...
        3. Call method X...
        4. See error
    validations:
      required: true

  - type: textarea
    id: policy
    attributes:
      label: Policy File
      description: Include the relevant `module-info.jguard` policy (if applicable).
      render: text
      placeholder: |
        security module com.example.myapp {
            entitle module to fs.read("src", "**/*");
        }

  - type: textarea
    id: stacktrace
    attributes:
      label: Error Output / Stack Trace
      description: Include any error messages or stack traces.
      render: text

  - type: input
    id: jguard-version
    attributes:
      label: jGuard Version
      description: What version of jGuard are you using?
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: java-version
    attributes:
      label: Java Version
      description: What JDK version are you running?
      options:
        - "21"
        - "22"
        - "23"
        - "24"
        - "Other (specify in additional context)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
