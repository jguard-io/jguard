name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  #
  # Check code formatting with Spotless
  #
  spotless:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (main build)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Check formatting (samples)
        working-directory: samples
        run: ../gradlew spotlessCheck --no-daemon

  #
  # Build and test on multiple platforms
  #
  build:
    name: Build (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [21]
        include:
          # Test on JDK 22 on Linux only
          - os: ubuntu-latest
            java: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test (main build)
        run: ./gradlew build --no-daemon

      - name: Build and test (samples)
        working-directory: samples
        run: ../gradlew build --no-daemon

      - name: Upload test reports
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/
            samples/**/build/reports/tests/
          retention-days: 7

  #
  # Verify Gradle wrapper integrity
  #
  wrapper-validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
