plugins {
  id "java-gradle-plugin"
}

dependencies {
  implementation(project(":policy"))
  implementation(libs.slf4j.api)
}

gradlePlugin {
  plugins {
    jguardPolicy {
      id = "org.jguard.policy"
      implementationClass = "org.jguard.gradle.policy.JGuardPolicyPlugin"
      displayName = "jGuard Policy Compiler"
      description = "Compiles module-info.jguard into policy metadata and packages it into JARs."
    }
  }
}
