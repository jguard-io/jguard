plugins {
  id "java"
  alias(libs.plugins.shadow)
}

dependencies {
  implementation(project(":core"))
  implementation(project(":policy"))
  implementation(libs.bundles.bytebuddy)

  // Bootstrap classes are compile-only: they're loaded from the embedded bootstrap.jar
  // at runtime via appendToBootstrapClassLoaderSearch(). This ensures single type identity
  // between JDK-instrumented code and agent code, avoiding Proxy overhead.
  compileOnly(project(":agent-bootstrap"))

  // Tests need bootstrap classes on the classpath
  testImplementation(project(":agent-bootstrap"))

  // SLF4J is optional - agent uses AgentLogger from bootstrap module for core logging
  // but can bridge to SLF4J if available on classpath
  compileOnly(libs.slf4j.api)
}

// ByteBuddy's classfiles use @SuppressFBWarnings annotations from FindBugs,
// which aren't on our classpath. This triggers -Xlint:classfile warnings.
// Suppress only this specific warning category to maintain strict checks elsewhere.
tasks.withType(JavaCompile).configureEach {
  options.compilerArgs += ["-Xlint:-classfile"]
}

// The agent jar must be a fat jar with all dependencies included
// because Java agents have limited classpath visibility
shadowJar {
  // Ensure bootstrap JAR is built before we try to embed it
  dependsOn project(":agent-bootstrap").tasks.named("jar")
  archiveClassifier.set("")  // Replace the default jar

  manifest {
    attributes(
      "Premain-Class": "io.jguard.agent.JGuardAgent",
      "Agent-Class": "io.jguard.agent.JGuardAgent",
      "Can-Redefine-Classes": "true",
      "Can-Retransform-Classes": "true"
    )
  }

  // Relocate ByteBuddy and ASM to avoid conflicts with apps using different versions
  relocate 'net.bytebuddy', 'io.jguard.internal.bytebuddy'
  relocate 'org.objectweb.asm', 'io.jguard.internal.asm'

  // CRITICAL: Exclude bootstrap classes from the shaded jar.
  // They must only exist in the embedded bootstrap.jar to ensure single type identity.
  exclude 'org/jguard/bootstrap/**'
}

// Inject the bootstrap JAR into the shadow JAR after it's built
shadowJar.doLast {
  def agentJar = archiveFile.get().asFile
  def bootstrapJarFile = project(":agent-bootstrap").jar.archiveFile.get().asFile

  // Use Java's zip filesystem to inject the bootstrap JAR
  def zipUri = URI.create("jar:" + agentJar.toURI())
  def env = [create: "false"]
  java.nio.file.FileSystems.newFileSystem(zipUri, env).withCloseable { zipFs ->
    def jguardDir = zipFs.getPath("/jguard")
    java.nio.file.Files.createDirectories(jguardDir)
    def targetPath = jguardDir.resolve("bootstrap.jar")
    java.nio.file.Files.copy(bootstrapJarFile.toPath(), targetPath, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
  }

  // Validate: bootstrap classes must NOT be in the agent jar (except embedded bootstrap.jar)
  def hasBootstrapClasses = zipTree(agentJar).matching {
    include 'org/jguard/bootstrap/**'
  }.files.size() > 0
  if (hasBootstrapClasses) {
    throw new GradleException("BUG: agent jar contains org/jguard/bootstrap/** classes. " +
        "They must only exist in the embedded bootstrap.jar for correct classloader identity.")
  }

  // Validate: embedded bootstrap.jar must exist
  def hasEmbeddedBootstrap = zipTree(agentJar).matching {
    include 'jguard/bootstrap.jar'
  }.files.size() > 0
  if (!hasEmbeddedBootstrap) {
    throw new GradleException("BUG: agent jar is missing embedded jguard/bootstrap.jar")
  }
}

// Disable the standard jar - shadowJar replaces it
jar.enabled = false

// Make assemble depend on shadowJar
tasks.named("assemble") {
  dependsOn shadowJar
}

// Configure publishing to use shadowJar instead of jar
afterEvaluate {
  publishing.publications.named("maven") {
    // Remove the default jar artifact and add shadowJar
    def artifactsToRemove = artifacts.findAll { it.classifier == '' || it.classifier == null }
    artifactsToRemove.each { artifacts.remove(it) }
    artifact(shadowJar)
  }
}

