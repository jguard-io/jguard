pluginManagement {
  // Include the main jGuard build to get access to the plugin
  includeBuild("../..")
}

plugins {
  id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = "sandbox-hot-reload"

dependencyResolutionManagement {
  repositories {
    mavenCentral()
  }
}

// Include jGuard for runtime dependencies
includeBuild("../..") {
  dependencySubstitution {
    substitute(module("io.jguard:core")).using(project(":core"))
    substitute(module("io.jguard:policy")).using(project(":policy"))
  }
}

include("app")
