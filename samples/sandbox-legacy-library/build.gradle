subprojects {
  plugins.withType(JavaPlugin) {
    java {
      toolchain {
        languageVersion = JavaLanguageVersion.of(21)
      }
      // Ensure non-modular dependencies become automatic modules
      modularity.inferModulePath = true
    }
  }
}
