plugins {
  id "java"
  id "application"
  id "io.jguard.policy"
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

application {
  mainClass = "io.jguard.samples.sandbox.Main"
  mainModule = "io.jguard.samples.sandbox"
}

repositories {
  mavenCentral()
}

dependencies {
  implementation("io.jguard:core")

  // The jguardAgent configuration is created by the plugin.
  // For published versions, use: jguardAgent("io.jguard:agent:VERSION")
  // For local development with composite builds, the plugin auto-detects the agent JAR.

  testImplementation("org.junit.jupiter:junit-jupiter:5.11.0")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.11.0")
  testImplementation("org.assertj:assertj-core:3.26.3")
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
  testLogging {
    events "PASSED", "FAILED", "SKIPPED"
    exceptionFormat "FULL"
  }
}

// Development mode: allow unsigned JARs for policy discovery
// In production, JARs should be signed and this should be false (the default)
jguardPolicy {
  allowUnsignedPolicies = true
}

// The runWithAgent task is now provided by the io.jguard.policy plugin!
// Usage:
//   ./gradlew runWithAgent              - Run with agent enforcement
//   ./gradlew runWithAgent -Pjguard.mode=audit  - Audit mode (log only)
//   ./gradlew runWithAgent -Pjguard.skip=true   - Skip agent (same as ./gradlew run)
//
// For composite builds, the plugin auto-detects the agent JAR from jguard/agent/build/libs
// Ensure the agent is built first: ./gradlew :jguard:agent:jar

// Make runWithAgent depend on agent build for composite builds
tasks.named("runWithAgent") {
  def jguardBuild = gradle.includedBuild("jguard")
  dependsOn(jguardBuild.task(":agent:jar"))
}

// Note: Enforcement testing is done via runWithAgent, not via a test task.
// The jGuard agent conflicts with Gradle's test infrastructure because it
// instruments classloaders, which interferes with Gradle's test workers.
// Use: ./gradlew runWithAgent to see enforcement in action.
