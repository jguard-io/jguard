plugins {
  id "java-library"
  id "io.jguard.policy"
}

// Java toolchain is configured in root build.gradle

// Development mode: allow unsigned JARs
// For production, remove this and sign your JARs (see README)
jguardPolicy {
  allowUnsignedPolicies = true
}
