plugins {
  id "base"
  id "com.diffplug.spotless" version "7.0.2"
}

// License header configuration
def licenseHeaderJava = file("../gradle/license/java-header.txt")
def licenseHeaderSlashSlash = file("../gradle/license/slashslash-header.txt")

spotless {
  // Java files (including module-info.java)
  java {
    target "*/src/**/*.java"
    licenseHeaderFile(licenseHeaderJava)
  }

  // jGuard policy files (use same style as Java)
  format "jguard", {
    target "*/src/**/*.jguard"
    licenseHeaderFile(licenseHeaderJava, "security ")
  }

  // Gradle build files
  groovyGradle {
    target "**/*.gradle"
    licenseHeaderFile(licenseHeaderSlashSlash, "(plugins|import|buildscript|pluginManagement|dependencyResolutionManagement|dependencies|rootProject|subprojects|allprojects)")
  }
}
